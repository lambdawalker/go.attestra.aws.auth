name: "Deploy AWS [Pulumi S3]"
run-name: "${{ inputs.operation }} AWS • ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment configured by setup
        required: true
        type: environment
        default: dev
      operation:
        description: Preview, deploy, or retry index publication
        required: true
        type: choice
        default: preview
        options:
          - preview
          - deploy
          - publish
      receipt_run_id:
        description: Failed workflow run ID (required only for publish)
        required: false
        type: string

permissions:
  contents: read

# Serialize operations for each environment, including previews. Never cancel an update.
concurrency:
  group: attestra-auth-${{ inputs.environment }}-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      STATE_BACKEND: ${{ vars.PULUMI_BACKEND_URL }}
      STACK_NAME: ${{ vars.PULUMI_STACK }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      RECEIPT_RUN_ID: ${{ inputs.receipt_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check environment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_ROLE_ARN STATE_BACKEND STACK_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set $name in the $DEPLOY_ENVIRONMENT environment (STATE_BACKEND is PULUMI_BACKEND_URL; STACK_NAME is PULUMI_STACK)."
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_ENVIRONMENT" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ || ${#DEPLOY_ENVIRONMENT} -gt 32 || "$STACK_NAME" != "$DEPLOY_ENVIRONMENT" ]]; then
            echo "::error::Environment must be a lowercase DNS-safe name and PULUMI_STACK must match it. Run setup for the selected environment."
            exit 1
          fi
          if [[ ! -f "infra/Pulumi.$STACK_NAME.yaml" ]]; then
            echo "::error::Missing infra/Pulumi.$STACK_NAME.yaml. Run setup and commit the encrypted stack configuration to main."
            exit 1
          fi
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$OPERATION" == preview || "$OPERATION" == deploy || "$OPERATION" == publish ]]
          if [[ "$OPERATION" == publish ]]; then [[ "$RECEIPT_RUN_ID" =~ ^[0-9]+$ ]]; fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            infra/go.sum
            infra-index/go.sum
            tools/deploy/go.sum
      - name: Test and compile deployment tool
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go -C infra-index test ./...
          go -C tools/deploy test ./...
          go -C tools/deploy vet ./...
          go -C tools/deploy build -o "$RUNNER_TEMP/attestra-deploy" .
      - name: Install Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6; install only
        with:
          pulumi-version: '3.264.0'
      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: attestra-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Restore pending index publication
        if: inputs.operation == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: index-recovery-${{ inputs.environment }}
          path: ${{ github.workspace }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.receipt_run_id }}
      - name: Build, preview, and optionally deploy
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/attestra-deploy" \
            -repo-root "$GITHUB_WORKSPACE" \
            -ci "$OPERATION" \
            -backend "$STATE_BACKEND" \
            -region "$AWS_REGION" \
            -stack "$STACK_NAME"

      - name: Retain pending index receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-recovery-${{ inputs.environment }}
          path: index-publication.${{ inputs.environment }}.local.json
          if-no-files-found: ignore
          retention-days: 90
