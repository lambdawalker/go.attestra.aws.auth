name: verify
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Test API and proof state machine
        run: |
          go mod tidy
          go test ./...
          go vet ./...
          ./build.sh
      - name: Compile Pulumi stack
        working-directory: infra
        run: |
          go mod tidy
          go build ./...
      - name: Save formatted source and dependency checksums
        run: |
          gofmt -w $(git ls-files '*.go')
          tar -czf generated.tgz $(git ls-files '*.go') go.mod go.sum infra/go.mod infra/go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: generated-go-source
          path: generated.tgz
